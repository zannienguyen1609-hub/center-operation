<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tính Lương Ops — IELTS 1984</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Ngăn iOS tự ý phóng to font khi xoay màn */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    /* ── Base — mobile-first ── */
    body {
      font-family: 'Nunito', sans-serif;
      background: #F5F5F7;
      color: #1D1D1F;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      /* Padding nhỏ trên mobile, thoáng hơn trên desktop */
      padding: 1rem 0.75rem;
    }

    @media (min-width: 480px) {
      body { padding: 2rem 1rem; }
    }

    /* ── Card wrapper ── */
    .card {
      background: #fff;
      border-radius: 16px;
      /* Padding compact hơn trên màn nhỏ */
      padding: 1.25rem 1rem;
      width: 100%;
      max-width: 600px;
      /* Tránh card tràn ra ngoài viewport */
      min-width: 0;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    @media (min-width: 480px) {
      .card { padding: 2rem 1.5rem; }
    }

    /* ── Hierarchy level 1: page title ── */
    .card__title {
      font-size: 1.75rem;     /* 28px trên mobile */
      font-weight: 800;
      line-height: 1.25;
      color: #1D1D1F;
      margin-bottom: 0.375rem;
      /* Tránh chữ dài tràn ngang */
      overflow-wrap: break-word;
      word-break: break-word;
    }

    @media (min-width: 480px) {
      .card__title { font-size: 2rem; } /* 32px trên desktop */
    }

    /* ── Hierarchy level 2: subtitle ── */
    .card__subtitle {
      font-size: 0.9375rem;
      font-weight: 600;
      color: #6E6E73;
      margin-bottom: 1.5rem;
      overflow-wrap: break-word;
    }

    /* ── Hierarchy level 3: body / labels ── */
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      margin-bottom: 1.25rem;
      /* Giữ field trong card, không tràn */
      width: 100%;
      min-width: 0;
    }

    .field label {
      font-size: 0.875rem;
      font-weight: 700;
      color: #1D1D1F;
    }

    .field input {
      /* Tường minh width: 100% — iOS Safari không tự stretch input */
      width: 100%;
      min-width: 0;
      font-family: 'Nunito', sans-serif;
      /* 16px để iOS không tự zoom khi focus */
      font-size: 1rem;
      font-weight: 600;
      color: #1D1D1F;
      background: #F5F5F7;
      border: 1.5px solid #E0E0E5;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      outline: none;
      /* Xóa style mặc định của iOS */
      -webkit-appearance: none;
      appearance: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .field input:focus {
      border-color: #F37500;
      background: #fff;
    }

    .field input::placeholder {
      color: #AEAEB2;
      font-weight: 400;
    }

    /* ── CTA button ── */
    .btn-primary {
      display: block;
      width: 100%;
      margin-top: 0.5rem;
      padding: 12px 20px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
      background: #F37500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      /* Loại bỏ highlight tap màu xám trên iOS */
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-primary:hover  { background: #D96800; }
    .btn-primary:active { transform: scale(0.98); }

    /* ── Result box ── */
    .result-box {
      margin-top: 1.5rem;
      background: #FFF4E8;
      border: 1.5px solid #F3C88A;
      border-radius: 12px;
      padding: 1.25rem 1rem;
      display: none;
      /* Tránh số dài tràn ngang */
      overflow: hidden;
      min-width: 0;
    }

    .result-box.visible { display: block; }

    .result-box__label {
      font-size: 0.8125rem;
      font-weight: 700;
      color: #F37500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.25rem;
    }

    .result-box__value {
      /* Co lại trên màn nhỏ, to hơn trên desktop */
      font-size: clamp(1.25rem, 6vw, 1.75rem);
      font-weight: 800;
      color: #1D1D1F;
      overflow-wrap: break-word;
      word-break: break-all;
    }

    /* ── Divider ── */
    .divider {
      border: none;
      border-top: 1px solid #E0E0E5;
      margin: 1.25rem 0;
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- Level 1 — 5-second test: người dùng biết ngay trang làm gì -->
    <h1 class="card__title">Tính Lương Nhân Viên Ops</h1>

    <!-- Level 2 — context ngắn gọn -->
    <p class="card__subtitle">Nhập số ngày công và hệ số để tính lương thực nhận.</p>

    <hr class="divider" />

    <!-- Level 3 — input fields với label rõ ràng -->
    <div class="field">
      <label for="days">Số ngày công trong tháng</label>
      <input
        id="days"
        type="number"
        min="0"
        max="31"
        placeholder="VD: 24"
        inputmode="decimal"
      />
    </div>

    <div class="field">
      <label for="rate">Đơn giá / ngày (VND)</label>
      <input
        id="rate"
        type="number"
        min="0"
        placeholder="VD: 350000"
        inputmode="decimal"
      />
    </div>

    <!-- Single, clear CTA -->
    <button class="btn-primary" onclick="calculate()">Tính lương</button>

    <!-- Result — chỉ hiện khi có kết quả -->
    <div class="result-box" id="result">
      <p class="result-box__label">Lương thực nhận</p>
      <p class="result-box__value" id="result-value">0 ₫</p>
    </div>

  </div>

  <script>
    function calculate() {
      const days = parseFloat(document.getElementById('days').value);
      const rate = parseFloat(document.getElementById('rate').value);

      const box   = document.getElementById('result');
      const value = document.getElementById('result-value');

      if (isNaN(days) || isNaN(rate) || days < 0 || rate < 0) {
        value.textContent = 'Vui lòng nhập số hợp lệ.';
        box.classList.add('visible');
        return;
      }

      const total = days * rate;
      value.textContent = total.toLocaleString('vi-VN') + ' ₫';
      box.classList.add('visible');
    }

    /* Allow Enter key to trigger calculate */
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') calculate();
    });
  </script>
</body>
</html>
